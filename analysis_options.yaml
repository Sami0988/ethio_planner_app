# Strict analysis for the Planner App. Feature phases must pass with zero
# warnings (Phase Definition of Done). Generated files are excluded.
#
# Note: migrating to `very_good_analysis` is a follow-up once `flutter pub
# outdated` can confirm a compatible version; this config raises strictness
# using the already-available `flutter_lints` plus analyzer language modes.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    invalid_annotation_target: ignore
    todo: warning
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"

linter:
  rules:
    prefer_single_quotes: true
    directives_ordering: true
    require_trailing_commas: true
    unawaited_futures: true
    use_build_context_synchronously: true
    avoid_redundant_argument_values: true
    prefer_const_constructors: true
    prefer_final_locals: true
